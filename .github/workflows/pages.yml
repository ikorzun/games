name: pages

# Публикация сборки рантайма (web-plain) на GitHub Pages: https://ikorzun.github.io/games/
# Требует один раз включить Pages в настройках репозитория: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [main, claude/magical-thompson-ore6eh]
    paths:
      - "runtime/**"
      - "episodes/**"
      - "locales/**"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: runtime/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Пока Pages не включён в настройках репозитория (или план GitHub не даёт Pages приватному
    # репозиторию), шаг деплоя падает по внешней причине и не должен красить PR.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
