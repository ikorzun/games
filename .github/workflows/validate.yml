name: validate

on:
  push:
    paths:
      - "episodes/**"
      - "locales/**"
      - "schemas/**"
      - "tools/**"
      - "runtime/**"
      - ".github/workflows/validate.yml"
  pull_request:

jobs:
  lint-episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - name: Validate schema files parse
        run: python3 -c "import json,glob; [json.load(open(p, encoding='utf-8')) for p in glob.glob('schemas/**/*.json', recursive=True)]; print('schemas ok')"
      - name: Lint every episode
        run: |
          set -e
          found=0
          for f in $(find episodes -name '*.json' -not -name '_*' -not -name 'globals.json' -not -path '*/_drafts/*'); do
            found=1
            echo "== $f"
            python3 tools/validate_episode.py "$f"
          done
          if [ "$found" = "0" ]; then echo "no episodes yet"; fi
      - name: Expression grammar self-test
        run: python3 tools/vnexpr_test.py

  runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build (web-plain) + dist checks
        run: npm run build
      - name: Build (Playgama) + dist checks
        run: npm run build:playgama
      - name: Install Chromium for smoke
        run: npx playwright-core install --with-deps chromium
      - name: Smoke (web-plain build)
        run: npm run smoke
      - name: Smoke (Playgama build, mock platform)
        run: npm run smoke -- --dist dist-playgama
      - uses: actions/upload-artifact@v4
        with:
          name: dist-playgama
          path: runtime/dist-playgama
          retention-days: 14
